  <link rel="stylesheet" href="assets/site.css">

  <style>
    .album-grid { display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:24px; }
    .album-card { background:var(--card);color:var(--text);border:1px solid var(--border-subtle);border-radius:16px;overflow:hidden;padding:0;text-align:left;cursor:pointer;transition:transform .2s; }
    .album-card:hover { transform:translateY(-4px); }
    .album-cover { display:flex;align-items:center;justify-content:center;height:140px;font-size:48px;background:linear-gradient(135deg,var(--accent-soft),transparent); }
    .album-content { display:flex;flex-direction:column;gap:8px;padding:20px; }
    .album-content .album-name { font-size:18px;line-height:1.4;margin:0; }
    .album-content>span { color:var(--muted);font-size:14px; }
    .album-content .album-availability { font-size:12px;color:var(--accent); }
    dialog { width:min(920px,calc(100% - 24px));max-height:calc(100dvh - 32px);overflow:auto;border:1px solid var(--border-subtle);border-radius:20px;padding:24px;background:var(--card);color:var(--text); }
    dialog::backdrop { background:rgba(0,0,0,.82); }
    .album-heading { display:flex;align-items:center;justify-content:space-between;gap:16px; }
    .album-heading h2 { margin:0;font-size:22px; }
    dialog button { min-height:44px;padding:8px 16px;border:1px solid var(--border-subtle);border-radius:10px;background:var(--accent-soft);color:var(--text);cursor:pointer; }
    .album-media { text-align:center;margin:24px 0; }
    .album-media img,.album-media video { max-width:100%;max-height:60dvh;border-radius:10px; }
    #album-empty { padding:48px 16px;color:var(--muted); }
    .album-controls { display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap; }
    #album-status { color:var(--muted);font-size:14px; }
  </style>
</head>
